services:
  kosync:
    image: ghcr.io/firetech/koreader-sync-sql:latest
    container_name: kosync
    ports:
      - 8081:8081
    volumes:
      - ./data:/data
    environment:
      - DATABASE_URL=sqlite:////data/kosync.db
      - RECEIVE_RANDOM_DEVICE_ID=False
      - OPEN_REGISTRATIONS=True
    restart: unless-stopped
